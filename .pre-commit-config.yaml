repos:
  - repo: local
    hooks:
      - id: company-agnostic
        name: Source code is free of "duolingo" mentions
        entry: bash -c '! grep -Hin duolingo $@' --
        language: system
        files: ^src/
  - repo: https://github.com/duolingo/pre-commit-hooks.git
    rev: 1.8.0
    hooks:
      - id: duolingo
        # pnpm rewrites pnpm-lock.yaml in its own YAML style on every
        # install; letting the formatter restyle it afterwards turns each
        # dependency change into a whole-file diff.
        exclude: (config\.yaml|^pnpm-lock\.yaml$)
